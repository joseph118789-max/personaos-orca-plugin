<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonaOS Workforce Bridge</title>
  <style>
    :root {
      --bg-primary: #18181b;
      --bg-secondary: #27272a;
      --bg-card: #202023;
      --border: #3f3f46;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text);
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warning);
    }
    .indicator.online { background: var(--success); }
    .indicator.offline { background: var(--danger); }

    .api-config-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      padding: 8px;
      background: var(--bg-secondary);
      border-radius: 6px;
      border: 1px solid var(--border);
      align-items: center;
    }
    .api-config-bar input {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--bg-secondary);
      color: var(--text);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-title {
      font-weight: 600;
      font-size: 13px;
    }
    .status-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .status-tag.idle, .status-tag.completed { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .status-tag.running, .status-tag.in_progress { background: rgba(56, 189, 248, 0.15); color: var(--info); }
    .status-tag.review { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-tag.failed, .status-tag.error { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .status-tag.pending { background: rgba(161, 161, 170, 0.15); color: var(--text-muted); }

    .btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    .btn-secondary {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: #323238; }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.35); }
    .btn-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: var(--success);
    }
    .btn-success:hover { background: rgba(34, 197, 94, 0.35); }

    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea, select {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .chip {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>PersonaOS Workforce</span>
    </div>
    <div class="badge" onclick="toggleApiBar()" title="Click to change API endpoint">
      <span class="indicator" id="api-status"></span>
      <span id="api-label">Connecting...</span>
    </div>
  </header>

  <div id="api-bar" class="api-config-bar" style="display:none;">
    <input type="text" id="api-url-input" placeholder="http://192.168.1.239:8000 or http://localhost:8000" />
    <button class="btn btn-sm" onclick="saveCustomApiUrl()">Save</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('workers', event)">Workers</button>
    <button class="tab-btn" onclick="switchTab('tasks', event)">Tasks</button>
    <button class="tab-btn" onclick="switchTab('dispatch', event)">New Task</button>
    <button class="tab-btn" onclick="switchTab('reviews', event)">Reviews</button>
  </div>

  <!-- Workers Tab -->
  <div id="tab-workers" class="tab-content active">
    <div id="workers-list">Loading workforce roster...</div>
  </div>

  <!-- Tasks Tab -->
  <div id="tab-tasks" class="tab-content">
    <div id="tasks-list">Loading tasks...</div>
  </div>

  <!-- New Task Tab -->
  <div id="tab-dispatch" class="tab-content">
    <div class="card">
      <div class="form-group">
        <label>Assign Worker</label>
        <select id="task-worker">
          <option value="se">Software Engineer (se)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="task-title" placeholder="e.g. Implement health check metrics" />
      </div>
      <div class="form-group">
        <label>Objective & Instructions</label>
        <textarea id="task-objective" rows="4" placeholder="Detail requirements, files, and expected deliverables..."></textarea>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="task-priority">
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <button class="btn" style="width: 100%" onclick="submitTask()">Dispatch Task</button>
    </div>
  </div>

  <!-- Reviews Tab -->
  <div id="tab-reviews" class="tab-content">
    <div id="reviews-list">Loading review queue...</div>
  </div>

  <script>
    // In-memory fallback if sandboxed iframe blocks localStorage
    var memoryStore = {};
    function safeStorageGet(key) {
      try {
        if (window.localStorage) {
          return window.localStorage.getItem(key);
        }
      } catch (e) {}
      return memoryStore[key] || null;
    }
    function safeStorageSet(key, val) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(key, val);
          return;
        }
      } catch (e) {}
      memoryStore[key] = val;
    }

    var candidates = [
      'http://192.168.1.239:8000',
      'http://localhost:8000',
      'http://127.0.0.1:8000'
    ];

    var savedUrl = safeStorageGet('personaos_api_url');
    var activeApiBase = savedUrl || 'http://192.168.1.239:8000';

    var inputEl = document.getElementById('api-url-input');
    if (inputEl) inputEl.value = activeApiBase;

    function toggleApiBar() {
      var bar = document.getElementById('api-bar');
      if (bar) {
        bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
      }
    }

    function saveCustomApiUrl() {
      var input = document.getElementById('api-url-input');
      if (!input) return;
      var val = input.value.trim();
      if (!val) return;
      if (!val.startsWith('http')) val = 'http://' + val;
      val = val.replace(/\/+$/, '');
      activeApiBase = val;
      safeStorageSet('personaos_api_url', val);
      var bar = document.getElementById('api-bar');
      if (bar) bar.style.display = 'none';
      checkHealth().then(function() {
        loadWorkers();
        loadTasks();
      });
    }

    function switchCandidate(url) {
      var input = document.getElementById('api-url-input');
      if (input) input.value = url;
      saveCustomApiUrl();
    }

    async function apiFetch(path, options = {}) {
      // 1. Try active URL directly
      try {
        const res = await fetch(`${activeApiBase}${path}`, options);
        if (res.ok || res.status !== 404) return res;
      } catch (e) {}

      // 2. Try with /api prefix
      try {
        const res = await fetch(`${activeApiBase}/api${path}`, options);
        if (res.ok || res.status !== 404) return res;
      } catch (e) {}

      // 3. Fallback: probe candidates if active is unreachable
      for (var i = 0; i < candidates.length; i++) {
        var c = candidates[i];
        if (c === activeApiBase) continue;
        try {
          var res = await fetch(`${c}${path}`, options);
          if (res.ok) {
            activeApiBase = c;
            safeStorageSet('personaos_api_url', c);
            var input = document.getElementById('api-url-input');
            if (input) input.value = c;
            return res;
          }
        } catch (e) {}
      }

      throw new Error(`Failed to fetch from ${activeApiBase}`);
    }

    function switchTab(name, ev) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (ev && ev.target) ev.target.classList.add('active');
      var el = document.getElementById('tab-' + name);
      if (el) el.classList.add('active');
      if (name === 'workers') loadWorkers();
      if (name === 'tasks') loadTasks();
      if (name === 'reviews') loadReviews();
    }

    async function checkHealth() {
      const indicator = document.getElementById('api-status');
      const label = document.getElementById('api-label');
      try {
        const res = await apiFetch('/health');
        if (res.ok) {
          if (indicator) indicator.className = 'indicator online';
          if (label) label.textContent = 'Connected (' + activeApiBase.replace(/^https?:\/\//, '') + ')';
          return true;
        } else {
          if (indicator) indicator.className = 'indicator offline';
          if (label) label.textContent = 'API Error';
          return false;
        }
      } catch (e) {
        if (indicator) indicator.className = 'indicator offline';
        if (label) label.textContent = 'Offline';
        return false;
      }
    }

    async function loadWorkers() {
      const container = document.getElementById('workers-list');
      const select = document.getElementById('task-worker');
      try {
        const res = await apiFetch('/workers');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const workers = Array.isArray(data) ? data : (data.workers || []);

        if (workers.length === 0) {
          container.innerHTML = '<div class="card" style="color:var(--text-muted)">No active workers registered.</div>';
          return;
        }

        if (select) {
          select.innerHTML = workers.map(w =>
            `<option value="${w.id}">${w.name || w.id} (${w.role || 'Worker'})</option>`
          ).join('');
        }

        container.innerHTML = workers.map(w => `
          <div class="card">
            <div class="card-header">
              <span class="card-title">${w.name || w.id}</span>
              <span class="status-tag ${w.status || 'idle'}">${w.status || 'idle'}</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">${w.description || w.role || 'Autonomous Worker'}</div>
            <div class="chip-container">
              ${(w.capabilities || []).map(c => `<span class="chip">${c}</span>`).join('')}
            </div>
            <div class="meta-row">
              <span>Profile v${w.current_profile_version || 1}</span>
              <span>Runtime: ${w.runtime || 'standard'}</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `
          <div class="card" style="border-color:var(--danger)">
            <div style="font-weight:600;color:var(--danger);margin-bottom:6px">Connection Error: ${e.message}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
              Cannot reach PersonaOS API at <code>${activeApiBase}</code>.<br/>
              Select an endpoint below or enter custom URL:
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-sm btn-secondary" onclick="switchCandidate('http://192.168.1.239:8000')">Use 192.168.1.239:8000</button>
              <button class="btn btn-sm btn-secondary" onclick="switchCandidate('http://localhost:8000')">Use localhost:8000</button>
              <button class="btn btn-sm" onclick="toggleApiBar()">Custom URL</button>
            </div>
          </div>
        `;
      }
    }

    async function loadTasks() {
      const container = document.getElementById('tasks-list');
      try {
        const res = await apiFetch('/tasks');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const tasks = Array.isArray(data) ? data : (data.tasks || []);
        if (tasks.length === 0) {
          container.innerHTML = '<div class="card" style="color:var(--text-muted)">No tasks recorded.</div>';
          return;
        }
        container.innerHTML = tasks.map(t => `
          <div class="card">
            <div class="card-header">
              <span class="card-title">${t.title || t.id.slice(0, 8)}</span>
              <span class="status-tag ${t.status}">${t.status}</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">${t.objective || ''}</div>
            <div class="meta-row">
              <span>Worker: ${t.assigned_worker || t.worker_id || 'unassigned'}</span>
              <span>Priority: ${t.priority || 'medium'}</span>
              <span>Gen: ${t.execution_generation || 1}</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<div class="card" style="color:var(--danger)">Failed to load tasks: ' + e.message + '</div>';
      }
    }

    async function loadReviews() {
      const container = document.getElementById('reviews-list');
      try {
        const res = await apiFetch('/tasks/review');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const tasks = await res.json();
        if (!tasks || tasks.length === 0) {
          container.innerHTML = '<div class="card" style="color:var(--text-muted);text-align:center;padding:20px;">No tasks currently pending review.</div>';
          return;
        }
        container.innerHTML = tasks.map(t => `
          <div class="card">
            <div class="card-header">
              <span class="card-title">${t.title || t.id.slice(0, 8)}</span>
              <span class="status-tag review">Review</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${t.objective || ''}</div>
            <div class="meta-row" style="margin-bottom:10px">
              <span>Worker: ${t.assigned_worker || t.worker_id || 'unassigned'}</span>
              <span>Gen: ${t.execution_generation || 1}</span>
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-success" style="flex:1" onclick="approveTask('${t.id}', ${t.execution_generation || 1})">Approve</button>
              <button class="btn btn-danger" style="flex:1" onclick="rejectTask('${t.id}', ${t.execution_generation || 1})">Reject</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<div class="card" style="color:var(--danger)">Failed to load review queue: ' + e.message + '</div>';
      }
    }

    async function approveTask(taskId, gen) {
      const reason = prompt('Approval justification (at least 10 chars):', 'Deliverables reviewed and approved for resolution.');
      if (!reason || reason.trim().length < 10) {
        alert('Reason must be at least 10 characters.');
        return;
      }
      try {
        const res = await apiFetch(`/tasks/${taskId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reason: reason.trim(),
            expected_generation: gen,
            reset_retries: true
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        alert('Task approved successfully!');
        loadReviews();
        loadTasks();
      } catch (e) {
        alert('Approval failed: ' + e.message);
      }
    }

    async function rejectTask(taskId, gen) {
      const reason = prompt('Rejection reason (at least 10 chars):', 'Deliverables did not meet specification.');
      if (!reason || reason.trim().length < 10) {
        alert('Reason must be at least 10 characters.');
        return;
      }
      try {
        const res = await apiFetch(`/tasks/${taskId}/reject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reason: reason.trim(),
            expected_generation: gen
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        alert('Task rejected.');
        loadReviews();
        loadTasks();
      } catch (e) {
        alert('Rejection failed: ' + e.message);
      }
    }

    async function submitTask() {
      const workerId = document.getElementById('task-worker').value;
      const title = document.getElementById('task-title').value.trim();
      const objective = document.getElementById('task-objective').value.trim();
      const priority = document.getElementById('task-priority').value;

      if (!title || !objective) {
        alert('Please provide a task title and objective.');
        return;
      }

      try {
        const res = await apiFetch('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            worker_id: workerId,
            title: title,
            objective: objective,
            priority: priority
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        alert('Task successfully dispatched to PersonaOS!');
        document.getElementById('task-title').value = '';
        document.getElementById('task-objective').value = '';
        switchTab('tasks');
      } catch (e) {
        alert('Dispatch failed: ' + e.message);
      }
    }

    // Auto-probe health on boot and start refresh loop
    checkHealth().then(function() {
      loadWorkers();
      loadTasks();
    });

    setInterval(function() {
      checkHealth();
      var activeTab = document.querySelector('.tab-content.active');
      if (activeTab && activeTab.id === 'tab-workers') loadWorkers();
      if (activeTab && activeTab.id === 'tab-tasks') loadTasks();
      if (activeTab && activeTab.id === 'tab-reviews') loadReviews();
    }, 4000);
  </script>
</body>
</html>
